[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # handtekening-PNG meebundelen met de functions (stap 3d)
  included_files = ["netlify/functions/_lib/assets/*", "netlify/functions/_lib/assets/shiftbase/*"]

# /api/* -> functions, zodat de frontend geen /.netlify/functions/ hoeft te kennen
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA-fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
