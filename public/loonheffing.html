<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#009f4b">
<title>SLA · Loonheffingsverklaring</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--groen:#009f4b;--donker:#333d3a;--grijs:#888078;--zand:#f8f3f0;--lijn:#e8e2de;--rood:#c0392b}
  *{box-sizing:border-box}body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:var(--zand);color:var(--donker);line-height:1.5}
  .wrap{max-width:620px;margin:0 auto;padding:28px 16px 48px}
  .logo{font-size:30px;font-weight:700;color:var(--groen);letter-spacing:1px}.logo small{display:block;font-size:11px;color:var(--grijs);font-weight:500;letter-spacing:0}
  .card{background:#fff;border-radius:14px;padding:26px 24px;margin-top:20px;box-shadow:0 6px 24px rgba(51,61,58,.08)}
  h1{font-size:1.15rem;margin:0 0 6px}.sub{color:var(--grijs);font-size:.9rem;margin:0 0 18px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--groen);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--lijn)}
  h2 b{display:inline-block;background:var(--groen);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:.72rem;margin-right:6px}
  .rij{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.rij3{display:grid;grid-template-columns:1.3fr 1fr .9fr;gap:0 10px}
  @media (max-width:520px){.rij{grid-template-columns:1fr}}
  .fg{margin:0 0 14px}label.kop{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grijs);margin-bottom:5px}
  label.kop i{font-style:normal;font-weight:400;text-transform:none}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--lijn);border-radius:8px;font:inherit;font-size:.95rem;background:#fff;color:var(--donker)}
  input:focus{outline:none;border-color:var(--groen)}
  .fg.fout input,.fg.fout canvas{border-color:var(--rood);background:#fdf3f2}.fg.fout .keus label{border-color:var(--rood)}
  .fm{display:none;color:var(--rood);font-size:.78rem;margin-top:4px}.fg.fout .fm{display:block}
  .hint{color:var(--grijs);font-size:.76rem;margin-top:4px}
  .keus{display:flex;gap:10px;flex-wrap:wrap}
  .keus label{flex:1;min-width:140px;display:flex;gap:8px;align-items:center;border:1.5px solid var(--lijn);border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
  .keus label.sel{border-color:var(--groen);background:#e6f7ee}.keus input{width:auto}
  .uitleg{background:var(--zand);border-radius:10px;padding:12px 14px;font-size:.84rem;margin:0 0 14px}
  .akkoord{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin:12px 0}.akkoord input{width:auto;margin-top:4px}
  canvas{width:100%;height:170px;border:1.5px dashed var(--lijn);border-radius:10px;background:#fff;touch-action:none;display:block}
  .tekenbalk{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;color:var(--grijs);margin-top:4px}.tekenbalk a{color:var(--groen)}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--groen);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}
  .melding{border-radius:8px;padding:12px 14px;font-size:.88rem;margin:0 0 16px;border-left:4px solid}.melding.rood{background:#fdecea;color:#8a1c12;border-color:var(--rood)}.melding.groen{background:#e6f7ee;color:#006b30;border-color:var(--groen)}.melding.oranje{background:#fff8e6;color:#5c4500;border-color:#f5a623}
  .voet{margin-top:22px;font-size:.75rem;color:var(--grijs);text-align:center}
  .taal{float:right;font-size:.8rem}.taal a{color:var(--grijs);text-decoration:none;margin-left:8px}.taal a.sel{color:var(--groen);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="taal"><a href="#" data-taal="nl" class="sel">NL</a><a href="#" data-taal="en">EN</a></div>
  <div class="logo">SLA<small>the good food bar · HR</small></div>
  <div class="card" id="card"><p class="sub">Even geduld…</p></div>
  <div class="voet" id="voet"></div>
</div>

  function canvasInit() {
