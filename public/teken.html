<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SLA · Document ondertekenen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--groen:#009f4b;--donker:#333d3a;--grijs:#888078;--zand:#f8f3f0;--lijn:#e8e2de;--rood:#c0392b}
  *{box-sizing:border-box}body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:var(--zand);color:var(--donker);line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
  .logo{font-size:30px;font-weight:700;color:var(--groen);letter-spacing:1px}.logo small{display:block;font-size:11px;color:var(--grijs);font-weight:500;letter-spacing:0}
  .card{background:#fff;border-radius:14px;padding:24px 22px;margin-top:18px;box-shadow:0 6px 24px rgba(51,61,58,.08)}
  h1{font-size:1.2rem;margin:0 0 6px}.sub{color:var(--grijs);font-size:.9rem;margin:0 0 16px}
  .stap{display:flex;gap:12px;margin:0 0 20px;padding-bottom:18px;border-bottom:1px solid var(--lijn)}.stap:last-of-type{border:0;padding-bottom:0}
  .nr{width:26px;height:26px;border-radius:50%;background:var(--zand);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}.stap.klaar .nr{background:var(--groen);color:#fff}
  .stap-b{flex:1;min-width:0}.stap-t{font-weight:700;margin:2px 0 8px}
  .pdf{width:100%;height:420px;border:1px solid var(--lijn);border-radius:8px;background:var(--zand)}
  .lnk{color:var(--groen);font-weight:600;font-size:.9rem}
  input[type=text],input[inputmode=numeric]{width:100%;padding:12px 14px;border:1.5px solid var(--lijn);border-radius:8px;font:inherit;font-size:1rem}
  .code{letter-spacing:8px;font-size:1.4rem!important;text-align:center;max-width:220px}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--groen);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}
  .btn2{padding:10px 16px;border:1.5px solid var(--lijn);border-radius:8px;background:#fff;font:inherit;font-weight:600;cursor:pointer}
  .melding{border-radius:8px;padding:12px 14px;font-size:.88rem;margin:0 0 14px;border-left:4px solid}.melding.rood{background:#fdecea;color:#8a1c12;border-color:var(--rood)}.melding.groen{background:#e6f7ee;color:#006b30;border-color:var(--groen)}
  canvas{width:100%;height:150px;border:1.5px dashed var(--lijn);border-radius:8px;background:#fff;touch-action:none}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin:12px 0}.chk input{margin-top:4px;width:18px;height:18px}
  .klein{font-size:.78rem;color:var(--grijs)}
  .voet{margin-top:22px;font-size:.75rem;color:var(--grijs);text-align:center}
  .taal{float:right;font-size:.8rem}.taal a{color:var(--grijs);text-decoration:none;margin-left:8px}.taal a.sel{color:var(--groen);font-weight:700}
  .klaar-ic{font-size:46px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="taal"><a href="#" data-taal="nl">NL</a><a href="#" data-taal="en">EN</a></div>
  <div class="logo">SLA<small>the good food bar · HR</small></div>
  <div class="card" id="card"><p class="sub">Even geduld…</p></div>
  <div class="voet" id="voet"></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), t = q.get('t') || '', info = null, taal = 'nl', codeVerstuurd = false, getekendIets = false;
  var TX = {
    nl: { titel: 'Document ondertekenen', hallo: 'Hoi {n}, hier kun je de brief die je per mail hebt gekregen digitaal ondertekenen. Dat kost een minuut.', s1: 'Lees de brief', open: 'Open de brief in een nieuw venster', s2: 'Bevestig dat jij het bent', s2u: 'We sturen een code van 6 cijfers naar {e}.', stuur: 'Stuur mij een code', opnieuw: 'Nieuwe code sturen', codeL: 'Code uit de mail', verstuurd: 'Code verstuurd naar {e}. Hij is {m} minuten geldig. Geen mail? Kijk ook in je spam.', s3: 'Onderteken', naamL: 'Typ je volledige naam', tekenL: 'Teken hier met je vinger of muis (optioneel)', wis: 'Wissen', akkoord: 'Ik heb de brief gelezen en onderteken hem voor ontvangst en akkoord.', knop: 'Ondertekenen', bezig: 'Bezig met ondertekenen…', klaar: 'Ondertekend!', klaarSub: 'Bedankt. Je hebt de brief ondertekend op {d}. Je krijgt een kopie per mail.', al: 'Deze brief is al ondertekend op {d}.', geen: 'Er staat geen brief klaar om te ondertekenen. Heb je een oudere link? Gebruik dan de link uit je laatste mail, of mail hr@ilovesla.com.', upload: 'Liever uitprinten en een foto of scan uploaden?', uploadL: 'Upload hier', juridisch: 'Je ondertekent met een elektronische handtekening. We leggen vast wanneer en vanaf welk apparaat je tekent, samen met een vingerafdruk van het document. Dat staat ook op een extra pagina onder de brief.', voet: 'Je gegevens worden opgeslagen in de beveiligde HR-omgeving van SLA. Vragen?' },
    en: { titel: 'Sign document', hallo: 'Hi {n}, here you can digitally sign the letter you received by e-mail. It takes a minute.', s1: 'Read the letter', open: 'Open the letter in a new window', s2: 'Confirm it is you', s2u: 'We will send a 6-digit code to {e}.', stuur: 'Send me a code', opnieuw: 'Send a new code', codeL: 'Code from the e-mail', verstuurd: 'Code sent to {e}. It is valid for {m} minutes. No e-mail? Please check your spam folder.', s3: 'Sign', naamL: 'Type your full name', tekenL: 'Draw your signature with your finger or mouse (optional)', wis: 'Clear', akkoord: 'I have read the letter and sign it for receipt and approval.', knop: 'Sign', bezig: 'Signing…', klaar: 'Signed!', klaarSub: 'Thank you. You signed the letter on {d}. You will receive a copy by e-mail.', al: 'This letter was already signed on {d}.', geen: 'There is no letter waiting for your signature. Using an older link? Please use the link from your latest e-mail, or e-mail hr@ilovesla.com.', upload: 'Prefer to print it and upload a photo or scan?', uploadL: 'Upload here', juridisch: 'You sign with an electronic signature. We record when and from which device you sign, together with a fingerprint of the document. This is also shown on an extra page below the letter.', voet: 'Your details are stored in SLA’s secure HR environment. Questions?' }
  };
  var g = function (id) { return document.getElementById(id); }, tx = function (k) { return TX[taal][k]; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function zetTaal(tl) { taal = tl; document.documentElement.lang = tl; document.querySelectorAll('[data-taal]').forEach(function (x) { x.classList.toggle('sel', x.getAttribute('data-taal') === tl); }); g('voet').innerHTML = esc(tx('voet')) + ' <a href="mailto:hr@ilovesla.com" style="color:var(--groen)">hr@ilovesla.com</a>'; }
  document.querySelectorAll('[data-taal]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); var naam = g('naam') ? g('naam').value : ''; zetTaal(a.getAttribute('data-taal')); render(); if (g('naam')) g('naam').value = naam; }; });
  async function post(b) { var r = await fetch('/api/teken', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: t }, b)) }); return r.json(); }
  var uploadUrl = '/upload.html?t=' + encodeURIComponent(t) + '&upload=1';
  function melding(id, cls, tekst) { g(id).innerHTML = tekst ? '<div class="melding ' + cls + '">' + esc(tekst) + '</div>' : ''; }
  function render() {
    var i = info;
    if (!i) { g('card').innerHTML = '<div class="melding rood">' + esc(tx('geen')) + '</div><p class="klein">' + esc(tx('upload')) + ' <a class="lnk" href="' + uploadUrl + '">' + esc(tx('uploadL')) + '</a></p>'; return; }
    if (i.status === 'getekend') { g('card').innerHTML = '<div class="klaar-ic">✅</div><h1 style="text-align:center">' + esc(tx('klaar')) + '</h1><p class="sub" style="text-align:center">' + esc(tx('al').replace('{d}', i.getekendOp)) + '</p>'; return; }
    var h = '<h1>' + esc(tx('titel')) + '</h1><p class="sub">' + esc(tx('hallo').replace('{n}', String(i.naam).split(' ')[0])) + '</p>'
      + '<div class="stap klaar"><div class="nr">1</div><div class="stap-b"><div class="stap-t">' + esc(tx('s1')) + ': ' + esc(i.titel) + '</div><iframe class="pdf" src="' + esc(i.pdf) + '#view=FitH" title="' + esc(i.titel) + '"></iframe><a class="lnk" href="' + esc(i.pdf) + '" target="_blank" rel="noopener">' + esc(tx('open')) + ' ↗</a></div></div>'
      + '<div class="stap' + (codeVerstuurd ? ' klaar' : '') + '"><div class="nr">2</div><div class="stap-b"><div class="stap-t">' + esc(tx('s2')) + '</div><p class="klein" style="margin:0 0 10px">' + esc(tx('s2u').replace('{e}', i.email)) + '</p><div id="m-code"></div>'
      + '<button class="btn2" id="b-code" type="button">' + esc(codeVerstuurd ? tx('opnieuw') : tx('stuur')) + '</button>'
      + '<div id="code-veld" style="margin-top:12px;' + (codeVerstuurd ? '' : 'display:none') + '"><div class="klein" style="margin-bottom:4px">' + esc(tx('codeL')) + '</div><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div></div></div>'
      + '<div class="stap"><div class="nr">3</div><div class="stap-b"><div class="stap-t">' + esc(tx('s3')) + '</div><div class="klein" style="margin-bottom:4px">' + esc(tx('naamL')) + '</div><input type="text" id="naam" autocomplete="name" placeholder="' + esc(i.naam) + '">'
      + '<div class="klein" style="margin:12px 0 4px;display:flex;justify-content:space-between"><span>' + esc(tx('tekenL')) + '</span><a href="#" id="wis" class="lnk" style="font-size:.78rem">' + esc(tx('wis')) + '</a></div><canvas id="doek"></canvas>'
      + '<label class="chk"><input type="checkbox" id="akkoord"><span>' + esc(tx('akkoord')) + '</span></label><p class="klein">' + esc(tx('juridisch')) + '</p><div id="m-teken"></div><button class="btn" id="b-teken" type="button">' + esc(tx('knop')) + '</button></div></div>'
      + '<p class="klein" style="margin-top:16px;text-align:center">' + esc(tx('upload')) + ' <a class="lnk" href="' + uploadUrl + '">' + esc(tx('uploadL')) + '</a></p>';
    g('card').innerHTML = h;
    g('b-code').onclick = stuurCode; g('b-teken').onclick = teken;
    doek(); g('wis').onclick = function (e) { e.preventDefault(); doek(); };
  }
  function doek() {
    var c = g('doek'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr;
    var x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#1a2a6c'; getekendIets = false;
    var aan = false, pos = function (e) { var b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.onpointerdown = function (e) { aan = true; c.setPointerCapture(e.pointerId); var p = pos(e); x.beginPath(); x.moveTo(p[0], p[1]); };
    c.onpointermove = function (e) { if (!aan) return; var p = pos(e); x.lineTo(p[0], p[1]); x.stroke(); getekendIets = true; };
    c.onpointerup = c.onpointercancel = function () { aan = false; };
  }
  async function stuurCode() {
    var b = g('b-code'); b.disabled = true;
    var r = await post({ stap: 'code' }); b.disabled = false;
    if (!r.success) { melding('m-code', 'rood', r.bericht); return; }
    codeVerstuurd = true; b.textContent = tx('opnieuw'); g('code-veld').style.display = ''; g('code').focus();
    melding('m-code', 'groen', tx('verstuurd').replace('{e}', r.email).replace('{m}', r.minuten));
    b.closest('.stap').classList.add('klaar');
  }
  async function teken() {
    var b = g('b-teken'); b.disabled = true; b.textContent = tx('bezig'); melding('m-teken', '', '');
    var r = await post({ stap: 'teken', code: (g('code') || {}).value || '', naam: g('naam').value, akkoord: g('akkoord').checked, handtekening: getekendIets ? g('doek').toDataURL('image/png') : null });
    if (!r.success) { b.disabled = false; b.textContent = tx('knop'); melding('m-teken', 'rood', r.bericht); return; }
    g('card').innerHTML = '<div class="klaar-ic">✅</div><h1 style="text-align:center">' + esc(tx('klaar')) + '</h1><p class="sub" style="text-align:center">' + esc(tx('klaarSub').replace('{d}', r.tijd)) + '</p>';
  }
  (async function () {
    try {
      var r = await post({});
      if (!r.success) throw new Error(r.bericht);
      info = r.teken;
      var qt = q.get('taal'); zetTaal(qt === 'en' || (!qt && info && info.taal === 'EN') ? 'en' : 'nl'); render();
    } catch (e) { zetTaal('nl'); g('card').innerHTML = '<div class="melding rood">' + esc(e.message) + '</div>'; }
  })();
})();
</script>
</body>
</html>
